<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>古典雷諾曼</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* 雷諾曼頁專屬：牌面、大牌陣與牌庫；共用樣式在 style.css */
:root{--wrap-w:860px;--flip-w:180px;--face-r:8px}
.lc{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.chain{font-family:var(--f-head);font-size:17px}
.gt-wrap{overflow-x:auto;padding-bottom:4px}
.gt{display:grid;grid-template-columns:repeat(9,minmax(56px,1fr));gap:6px;min-width:540px}
.cell{background:none;border:0;padding:0;cursor:pointer;border-radius:6px;position:relative;color:var(--ink)}
.cell .lc{border-radius:6px}
.cell.sig{outline:2px solid var(--gold);outline-offset:1px}
.cell.near{outline:1px dashed var(--gold);outline-offset:1px}
.cell .pos-no{position:absolute;right:3px;bottom:2px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.legend .s{outline:2px solid var(--gold)}
.legend .n{outline:1px dashed var(--gold)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.lib button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;text-align:center}
.lib span{font-size:13px}
@media (max-width:380px){.dlg{grid-template-columns:1fr}.dlg .lc{max-width:120px}}
.gt-back{color:var(--gold);border-radius:6px;overflow:hidden}
.gt-back svg{display:block;width:100%;height:auto;aspect-ratio:2/3}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="./">← 塔羅與雷諾曼</a>
    <div class="eyebrow">PETIT LENORMAND · 36 CARDS</div>
    <h1>古典雷諾曼</h1>
    <p class="note">36 張牌，每張附撲克牌角標。雷諾曼不分正逆位，習慣把相鄰的牌連起來讀。</p>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-daily" aria-selected="true" data-view="daily">今日一牌</button>
    <button role="tab" id="tab-three" aria-selected="false" data-view="three">三張牌</button>
    <button role="tab" id="tab-gt" aria-selected="false" data-view="gt">大牌陣 9×4</button>
    <button role="tab" id="tab-lib" aria-selected="false" data-view="lib">牌庫</button>
  </nav>

  <section id="view-daily">
    <div class="daily">
      <div class="slot"><div class="flip" id="dailyFlip"></div></div>
      <div class="readings" id="dailyReading"></div>
    </div>
    <p class="note">依日期計算，同一天看到同一張，隔天更換。</p>
    <section class="ai" id="aiDaily" hidden></section>
  </section>

  <section id="view-three" hidden>
    <div class="row"><input type="text" id="q" placeholder="想問的事（可留白）" maxlength="80"></div>
    <div class="row"><button class="btn" id="drawThree">抽三張</button></div>
    <div id="threeArea" class="readings"></div>
    <section class="ai" id="aiThree" hidden></section>
  </section>

  <section id="view-gt" hidden>
    <div class="row"><input type="text" id="gtQ" placeholder="想問的事（可留白）" maxlength="80"></div>
    <div class="row">
      <label for="sig" class="note">代表自己的牌</label>
      <select id="sig"><option value="29">29 女士</option><option value="28">28 男士</option></select>
      <button class="btn" id="drawGT">排出 36 張</button>
    </div>
    <div class="legend"><span><i class="s"></i>代表牌</span><span><i class="n"></i>上下左右相鄰的牌</span><span>格子右下角數字是牌位 1–36</span></div>
    <div class="gt-wrap"><div class="gt" id="gt"></div></div>
    <div id="gtInfo" class="readings"></div>
    <section class="ai" id="aiGT" hidden></section>
    <p class="note">這裡只排出牌位並標出代表牌與相鄰牌，不自動產生整體解讀。大牌陣的宮位、距離等讀法各家不同，未納入。</p>
  </section>

  <section id="view-lib" hidden>
    <div class="lib" id="lib"></div>
  </section>

  <footer>
    <p class="note">牌序與撲克牌對應依常見的 36 張 Petit Lenormand 排列。牌義為依傳統整理的象徵性解讀，僅供自我反思參考，無法以科學方法驗證，也不構成任何醫療、法律或財務判斷。抽牌使用瀏覽器的隨機數產生器。</p>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg"><div id="dlgArt"></div><div class="readings" id="dlgText"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="dlgClose">關閉</button></div>
</dialog>

<script src="common.js"></script>
<script>
// [編號, 中文, 英文, 撲克牌, 關鍵字, 說明]
const DATA=[
[1,"騎士","Rider","9♥","消息、來訪、速度","消息或人很快到來，事情開始動起來。"],
[2,"幸運草","Clover","6♦","小幸運、機會、短暫","小而短暫的好運，適合把握眼前的機會。"],
[3,"船","Ship","10♠","旅行、遠方、轉變","移動、遠行，或想往外發展。"],
[4,"房屋","House","K♥","家、穩定、私人領域","與家庭、居所和安全感有關。"],
[5,"樹","Tree","7♥","成長、根基、長期","緩慢而長期的成長；傳統上也與身體狀態相關（象徵意義）。"],
[6,"雲","Clouds","K♣","不明、困惑、暫時阻礙","狀況還不清楚，先別急著判斷。"],
[7,"蛇","Snake","Q♣","迂迴、複雜、慾望","事情繞路或牽涉複雜關係，留意細節。"],
[8,"棺材","Coffin","9♦","結束、停滯、休息","某件事告一段落，或需要停下來休息（象徵意義，非字面）。"],
[9,"花束","Bouquet","Q♠","禮物、讚賞、愉快","收到好意，或發生令人開心的事。"],
[10,"鐮刀","Scythe","J♦","突然、切斷、決定","快速的決定或突然的變化。"],
[11,"鞭子","Whip","J♣","爭執、反覆、重複","反覆的討論、衝突或練習。"],
[12,"鳥","Birds","7♦","交談、溝通、緊張","對話、電話或閒聊，也可能是焦慮不安。"],
[13,"孩子","Child","J♠","新開始、小、單純","剛開始的事、規模小，或單純的心態。"],
[14,"狐狸","Fox","9♣","工作、謹慎、策略","與工作有關；也提醒留意是否有算計。"],
[15,"熊","Bear","10♣","力量、資源、權威","有份量的人或資源，包含財務。"],
[16,"星星","Stars","6♥","方向、希望、清晰","目標清楚，看得見方向。"],
[17,"鸛鳥","Stork","Q♥","改變、搬遷、改善","往較好的方向改變或移動。"],
[18,"狗","Dog","10♥","朋友、忠誠、信任","可信任的朋友或支持者。"],
[19,"塔","Tower","6♠","機構、權威、距離","公司、政府等正式組織，或與人保持距離。"],
[20,"花園","Garden","8♠","公眾、社交、聚會","群體、活動與公開場合。"],
[21,"山","Mountain","8♣","阻礙、延遲、挑戰","遇到需要時間跨越的障礙。"],
[22,"十字路口","Crossroads","Q♦","選擇、分岔、多個選項","需要在幾條路之間做決定。"],
[23,"老鼠","Mice","7♣","消耗、損失、壓力","資源或心力正在慢慢被消耗。"],
[24,"心","Heart","J♥","愛、感情、熱情","感情與真心。"],
[25,"戒指","Ring","A♣","承諾、合約、循環","約定、合約，或重複的循環。"],
[26,"書","Book","10♦","秘密、知識、學習","尚未公開的資訊，或需要學習的事。"],
[27,"信","Letter","7♠","文件、訊息、書面","書面溝通、文件或通知。"],
[28,"男士","Gentleman","A♥","問卜者、男性","代表問卜者（男性），或事件中的男性。"],
[29,"女士","Lady","A♠","問卜者、女性","代表問卜者（女性），或事件中的女性。"],
[30,"百合","Lilies","K♠","成熟、平靜、年長","成熟與和諧，也可指年長或有智慧的人。"],
[31,"太陽","Sun","A♦","成功、能量、順利","順利，充滿活力。"],
[32,"月亮","Moon","8♥","名聲、認可、情緒","被看見與肯定，也與情緒相關。"],
[33,"鑰匙","Key","8♦","解答、關鍵、確定","找到方法，或事情確定會發生。"],
[34,"魚","Fish","K♦","金錢、交易、流動","財務、生意與資源的流動。"],
[35,"錨","Anchor","9♠","穩定、持久、扎根","長期穩定，站穩腳步。"],
[36,"十字架","Cross","6♣","負擔、責任、考驗","沉重的責任，或必須承擔的事。"]
];
const DECK=DATA.map(d=>({n:d[0],zh:d[1],en:d[2],pc:d[3],kw:d[4].split("、"),text:d[5]}));
const byNo=n=>DECK[n-1];

/* ---------- 牌面圖片 ---------- */
const SLUG="rider clover ship house tree clouds snake coffin bouquet scythe whip birds child fox bear stars stork dog tower garden mountain crossroads mice heart ring book letter gentleman lady lilies sun moon key fish anchor cross".split(" ");
/* 翻牌區最寬約 180px；大牌陣每格約 90px；牌庫與彈窗約 120px。實際挑哪一張由 common.js 的 srcset 決定 */
const face=(c,opt={})=>cardImg(`lenormand-${String(c.n).padStart(2,"0")}-${SLUG[c.n-1]}.webp`,{alt:c.n+" "+c.zh,cls:"lc",sizes:"120px",...opt});
const BACK=`<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="1" y="1" width="98" height="148" rx="7" fill="var(--back)"/>
<rect x="6" y="6" width="88" height="138" rx="4" fill="none" stroke="currentColor" stroke-width=".6"/>
<g fill="none" stroke="currentColor" stroke-width=".7">
${[0,1,2,3,4,5].map(r=>[0,1,2,3,4,5].map(c=>`<rect x="${17+c*11}" y="${42+r*11}" width="9" height="9" rx="1"/>`).join("")).join("")}
</g><text x="50" y="132" text-anchor="middle" style="font-family:var(--f-display)" font-size="9" letter-spacing="2" fill="currentColor">XXXVI</text></svg>`;

/* ---------- 隨機與日期（rand、shuffle、todayKey、hashKey 在 common.js） ---------- */
const shuffled=()=>shuffle(DECK);
const dailyCard=key=>DECK[hashKey("lenormand:"+key)%36];

/* ---------- 呈現 ---------- */
const flipHTML=(c,eager)=>`<div class="flip-inner"><div class="face back">${BACK}</div><div class="face front">${face(c,{sizes:"180px",eager})}</div></div>`;
function readingHTML(c,pos){
  return `<div class="reading">${pos?`<div class="pos">${pos}</div>`:""}
  <div class="nm">${c.n}　${c.zh}</div><div class="en">${c.en} · ${c.pc}</div>
  <div class="kw">${c.kw.map(k=>`<span>${k}</span>`).join("")}</div><p>${c.text}</p></div>`;
}
/* ---------- 給 AI 解讀（showAi、assemble 等在 common.js） ---------- */
const LEN_RULES=["不要重新抽牌或重新排牌。","不要另外產生隨機牌。","以下牌面就是本次實際結果，請直接依資料解讀。","請區分「傳統雷諾曼象徵性詮釋」與客觀事實。","雷諾曼屬象徵性解讀，目前無法以科學方法驗證其預測能力。","【關鍵字】與【本頁牌義】是本網站自撰的簡短說明，不是特定雷諾曼書的原文，請勿當成經典引用。","撲克牌角標只是牌面標示，本頁沒有套用撲克牌占卜的讀法。"];
const lenLine=(c,label)=>[label+"："+c.n+" "+c.zh+" "+c.en+"（"+c.pc+"）","   關鍵字："+c.kw.join("、"),"   本頁牌義："+c.text].join("\n");
const LEN_INTRO="請依照古典雷諾曼（Petit Lenormand）的傳統象徵，解讀以下這次已經完成的結果。";
function lenSimplePrompt({question,cards,labels,spread}){
  const multi=cards.length>1;
  const steps=[["每張牌的核心意象",multi?"逐張說明每張牌在它所在位置的主要意思。":"說明這張牌的主要意思。"]];
  if(multi)steps.push(["牌與牌的串連","把牌依「"+labels.join(" → ")+"」的順序連成一段完整的脈絡，不要逐張獨立解釋。"]);
  return assemble({intro:LEN_INTRO,rules:LEN_RULES,question,spread,steps,
    body:["【牌面】",...cards.map((c,i)=>lenLine(c,(i+1)+". "+labels[i]))]});
}
function gtPrompt({question,layout,si,nb}){
  const sig=layout[si],r=Math.floor(si/9)+1,col=si%9+1;
  const rules=LEN_RULES.concat(["牌位的編號、列與欄就是本次實際排列，請勿重排。","大牌陣的宮位、距離、鏡像等讀法各家不同，本頁沒有套用任何一種；若你要採用某種讀法，請先說明是哪一種，不要當成唯一標準。","資訊不足以回答時，請直接說明不足，不要硬編。"]);
  const body=["【代表牌】",sig.n+" "+sig.zh+"（牌位 "+(si+1)+"，第 "+r+" 列第 "+col+" 欄）","","【全部牌位】（由左到右、由上到下，編號 1–36）"];
  for(let row=0;row<4;row++){body.push("第 "+(row+1)+" 列：");for(let c=0;c<9;c++){const i=row*9+c,k=layout[i];body.push("  牌位 "+(i+1)+"："+k.n+" "+k.zh+"（"+k.en+"，"+k.pc+"）");}}
  body.push("","【代表牌上下左右相鄰的牌】",...nb.map(([lab,i])=>lenLine(layout[i],lab+"（牌位 "+(i+1)+"）")),"","【36 張牌的本頁牌義（供對照）】",...DECK.map(c=>c.n+" "+c.zh+"："+c.kw.join("、")+"。"+c.text));
  return assemble({intro:LEN_INTRO,rules,question,spread:"大牌陣 9×4（36 張全部攤開，共 4 列、每列 9 張）",body,
    steps:[["代表牌周邊","先讀代表牌與它上下左右相鄰的牌，說明代表牌目前所處的狀態。"],["其他相關的牌","再挑出你認為與問題最相關的牌，並說明依據的牌位，不要憑空指定。"]]});
}

// 今日一牌
(function(){
  const key=todayKey(),c=dailyCard(key),f=document.getElementById("dailyFlip");
  f.innerHTML=flipHTML(c,true);f.setAttribute("role","img");f.setAttribute("aria-label",c.n+" "+c.zh);
  document.getElementById("dailyReading").innerHTML=`<p class="note">${key}</p>`+readingHTML(c,"今日");
  showAi("aiDaily",lenSimplePrompt({question:"",cards:[c],labels:["今日一牌"],spread:"今日一牌（日期 "+key+"，同一天固定同一張）"}));
  openLater([f]);
})();

// 三張牌
const threeArea=document.getElementById("threeArea");
function drawThree(){
  const q=document.getElementById("q").value.trim(),cards=shuffled().slice(0,3),labels=["第一張","第二張","第三張"];
  threeArea.innerHTML=(q?`<p class="question">${esc(q)}</p>`:"")+
    `<div class="spread">${cards.map((c,i)=>`<div class="slot"><div class="slot-label">${labels[i]}</div><div class="flip" role="img" aria-label="${c.n} ${c.zh}">${flipHTML(c)}</div></div>`).join("")}</div>`+
    `<p class="chain">${cards.map(c=>c.kw[0]).join("　→　")}</p>`+
    `<p class="note">上面一行是三張牌的第一個關鍵字依序串起來，方便你自己組句。</p>`+
    cards.map((c,i)=>readingHTML(c,labels[i])).join("");
  showAi("aiThree",lenSimplePrompt({question:q,cards,labels,spread:"三張牌（依序：第一張、第二張、第三張）"}));
  openLater([...threeArea.querySelectorAll(".flip")]);
}
document.getElementById("drawThree").onclick=drawThree;
/* 還沒抽牌時只顯示牌背（蓋著），按下按鈕才抽牌並翻開 */
function showBacks(){
  threeArea.innerHTML=`<div class="spread">${["第一張","第二張","第三張"].map(l=>`<div class="slot"><div class="slot-label">${l}</div><div class="flip" role="img" aria-label="牌背，尚未抽牌"><div class="flip-inner"><div class="face back">${BACK}</div></div></div></div>`).join("")}</div><p class="note">牌都蓋著。想好問題後，按「抽三張」。</p>`;
  document.getElementById("aiThree").hidden=true;
}
showBacks();

// 大牌陣 9×4
const gt=document.getElementById("gt"),gtInfo=document.getElementById("gtInfo"),sigSel=document.getElementById("sig");
let layout=[];
function neighbors(i){const r=Math.floor(i/9),c=i%9,out=[];
  if(r>0)out.push(["上方",i-9]);if(r<3)out.push(["下方",i+9]);if(c>0)out.push(["左方",i-1]);if(c<8)out.push(["右方",i+1]);return out;}
function renderGT(){
  const sigNo=+sigSel.value,si=layout.findIndex(c=>c.n===sigNo),nb=neighbors(si);
  const nbSet=new Set(nb.map(x=>x[1]));
  gt.innerHTML=layout.map((c,i)=>`<button class="cell${i===si?" sig":nbSet.has(i)?" near":""}" id="cell-${i}" data-i="${i}" aria-label="牌位 ${i+1}：${c.n} ${c.zh}">${face(c,{sizes:"90px"})}<span class="pos-no">${i+1}</span></button>`).join("");
  showAi("aiGT",gtPrompt({question:gtQuestion,layout,si,nb}));
  const r=Math.floor(si/9)+1,col=si%9+1;
  gtInfo.innerHTML=`<p class="note">代表牌「${layout[si].n} ${layout[si].zh}」在第 ${r} 列、第 ${col} 欄（牌位 ${si+1}）。</p>`+
    nb.map(([lab,i])=>readingHTML(layout[i],`${lab}・牌位 ${i+1}`)).join("");
}
let gtQuestion="";
function drawGT(){gtQuestion=document.getElementById("gtQ").value.trim();layout=shuffled();renderGT();}
document.getElementById("drawGT").onclick=drawGT;
sigSel.onchange=()=>{if(layout.length)renderGT();};
function showGTBacks(){
  gt.innerHTML=Array.from({length:36},()=>`<div class="gt-back" role="img" aria-label="牌背，尚未排牌">${BACK}</div>`).join("");
  gtInfo.innerHTML=`<p class="note">36 張牌都蓋著。想好問題後，按「排出 36 張」。</p>`;
  document.getElementById("aiGT").hidden=true;
}
showGTBacks();

// 牌庫與彈窗
const dlg=document.getElementById("dlg");
function show(c){document.getElementById("dlgArt").innerHTML=face(c);document.getElementById("dlgText").innerHTML=readingHTML(c,"");dlg.showModal();}
const lib=document.getElementById("lib");
lib.innerHTML=DECK.map(c=>`<button data-n="${c.n}" id="lib-${c.n}">${face(c)}<span>${c.n} ${c.zh}</span></button>`).join("");
lib.onclick=e=>{const b=e.target.closest("[data-n]");if(b)show(byNo(+b.dataset.n));};
gt.onclick=e=>{const b=e.target.closest("[data-i]");if(b)show(layout[+b.dataset.i]);};
document.getElementById("dlgClose").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});

// 分頁
</script>
<script src="tabs.js"></script>
</body>
</html>
