<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<title>七十八張塔羅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: 單欄閱讀區（最大 760px），上方三個分頁；牌面為 cards/ 資料夾內的圖片 */
:root{
  --bg:#E6EAE4; --surface:#F4F6F2; --ink:#1E3638; --muted:#556866; --line:#C3CCC4;
  --gold:#9A6F1E; --gold-soft:#E7D7AE; --card:#FBFAF5; --back:#1E3638;
  --f-display:"Marcellus SC","Noto Serif TC",Georgia,serif;
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111C1C; --surface:#182626; --ink:#DCE4DD; --muted:#93A6A2; --line:#2C3E3D;
  --gold:#D4A64E; --gold-soft:#3A3220; --card:#1D2B2A; --back:#0B1414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111C1C; --surface:#182626; --ink:#DCE4DD; --muted:#93A6A2; --line:#2C3E3D;
  --gold:#D4A64E; --gold-soft:#3A3220; --card:#1D2B2A; --back:#0B1414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-display);letter-spacing:.18em;font-size:12px;color:var(--gold)}
h1{font-family:var(--f-head);font-weight:700;font-size:30px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-family:var(--f-head);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
p{margin:0}
.note{font-size:13px;color:var(--muted)}
.home{font-size:13px;color:var(--muted);text-decoration:none;align-self:flex-start;margin-bottom:6px}
.home:hover{color:var(--gold)}
.site-link{margin-top:6px;font-size:14px}
.site-link a{color:var(--gold);text-decoration:none;border-bottom:1px solid currentColor}
.site-link a:hover{opacity:.8}
.site-link a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

nav{display:flex;gap:6px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:15px;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--gold);font-weight:500}
button:focus-visible,input:focus-visible,.lib-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

section{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:500;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text]{font:inherit;flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px}

/* card */
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.slot-label{font-family:var(--f-head);font-size:13px;color:var(--muted);letter-spacing:.1em}
.flip{width:100%;max-width:200px;aspect-ratio:7/12;perspective:900px}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden}
.face svg{display:block;width:100%;height:100%}
.face img{display:block;width:100%;height:100%;object-fit:cover}
.face.front{transform:rotateY(180deg)}
.face.back svg{color:var(--gold)}
.face.front svg{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}

.daily{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:24px;align-items:start}
@media (max-width:520px){.daily{grid-template-columns:1fr}.daily .slot{max-width:200px;margin:0 auto;width:100%}}
.spread{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.single{display:grid;grid-template-columns:minmax(0,200px);justify-content:center}

.reading{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--surface);border-radius:8px;min-width:0}
.reading .pos{font-size:12px;color:var(--gold);letter-spacing:.12em}
.reading .nm{font-family:var(--f-head);font-weight:700;font-size:18px}
.reading .en{font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:.06em}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw span{font-size:12px;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:1px 10px}
.readings{display:flex;flex-direction:column;gap:10px}
.question{font-family:var(--f-head);font-size:16px;border-left:2px solid var(--gold);padding-left:12px}

/* library */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.lib-card{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);font:inherit;text-align:center;border-radius:8px}
.lib-card svg{width:100%;aspect-ratio:7/12;color:var(--ink);display:block}
.lib-card img{width:100%;aspect-ratio:7/12;object-fit:cover;display:block;border-radius:8px}
.lib-card span{font-size:13px}
dialog{border:0;border-radius:12px;background:var(--bg);color:var(--ink);padding:20px;max-width:min(420px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(10,20,20,.55)}
.dlg{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.dlg svg{width:100%;color:var(--ink)}
.dlg img{width:100%;aspect-ratio:7/12;object-fit:cover;border-radius:8px}
@media (max-width:380px){.dlg{grid-template-columns:1fr}.dlg svg,.dlg img{max-width:120px}}
.ai{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ai h2{font-family:var(--f-head);font-size:18px;margin:0}
.ai-copy{font:inherit;font-weight:500;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 18px;cursor:pointer;align-self:flex-start}
.ai-copy:hover{border-color:var(--gold)}
.ai-copy:focus-visible,.ai-box:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ai-box{margin:0;max-height:260px;overflow:auto;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,Consolas,"Noto Sans TC",monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="home" href="./">← 塔羅與雷諾曼</a>
    <div class="eyebrow">TAROT · 78 CARDS</div>
    <h1>七十八張塔羅</h1>
    <p class="note">22 張大阿爾克那＋56 張小阿爾克那，目前只使用正位。</p>
    <p class="site-link"><a href="https://rita112025-cpu.github.io/yijing/">另一種占卜：易經起卦 →</a></p>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-daily" aria-selected="true" data-view="daily">今日一牌</button>
    <button role="tab" id="tab-draw" aria-selected="false" data-view="draw">抽牌</button>
    <button role="tab" id="tab-lib" aria-selected="false" data-view="lib">牌庫</button>
  </nav>

  <section id="view-daily">
    <div class="daily">
      <div class="slot"><div class="flip" id="dailyFlip"></div></div>
      <div class="readings" id="dailyReading"></div>
    </div>
    <p class="note">今日一牌依日期計算，同一天打開看到的是同一張；跨日後更換。</p>
    <section class="ai" id="aiDaily" aria-labelledby="aiDaily-t" hidden>
      <h2 id="aiDaily-t">給 AI 解讀</h2>
      <p class="note">已將本次占卜整理成 AI 可讀格式。本頁不會自動送出，貼到哪個 AI 由你決定。</p>
      <button type="button" class="ai-copy" data-copy="aiDaily">複製提示詞</button>
      <p class="note" id="aiDaily-s" aria-live="polite"></p>
      <pre class="ai-box" tabindex="0" role="region" aria-label="AI 解讀提示詞"><code id="aiDaily-p"></code></pre>
    </section>
  </section>

  <section id="view-draw" hidden>
    <div class="row">
      <input type="text" id="q" placeholder="想問的事（可留白）" maxlength="80">
    </div>
    <div class="row">
      <button class="btn" id="drawThree">抽三張：過去・現在・未來</button>
      <button class="btn ghost" id="drawOne">抽一張</button>
    </div>
    <div id="drawArea" class="readings"></div>
    <section class="ai" id="aiDraw" aria-labelledby="aiDraw-t" hidden>
      <h2 id="aiDraw-t">給 AI 解讀</h2>
      <p class="note">已將本次占卜整理成 AI 可讀格式。本頁不會自動送出，貼到哪個 AI 由你決定。</p>
      <button type="button" class="ai-copy" data-copy="aiDraw">複製提示詞</button>
      <p class="note" id="aiDraw-s" aria-live="polite"></p>
      <pre class="ai-box" tabindex="0" role="region" aria-label="AI 解讀提示詞"><code id="aiDraw-p"></code></pre>
    </section>
  </section>

  <section id="view-lib" hidden>
    <div class="filters" id="filters"></div>
    <div class="lib" id="lib"></div>
  </section>

  <footer>
    <p class="note">牌義為依塔羅傳統整理的象徵性解讀，僅供自我反思參考，無法以科學方法驗證，也不構成任何醫療、法律或財務判斷。抽牌使用瀏覽器的隨機數產生器；牌面為 AI 生成的新藝術風格圖像。</p>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg"><div id="dlgArt"></div><div class="readings" id="dlgText"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" id="dlgClose">關閉</button></div>
</dialog>

  ["學習、計畫、務實","踏實地學習新技能。"],
  ["穩定、可靠、按部就班","慢但確實地推進。"],
  ["照顧、務實、資源管理","兼顧生活與實務。"],
  ["富足、穩健、經營能力","以穩健的方式管理資源。"]]}
};
const RANK_ZH=["王牌","二","三","四","五","六","七","八","九","十","侍者","騎士","皇后","國王"];
const RANK_EN=["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"];

const DECK=[];
MAJOR.forEach((m,i)=>DECK.push({id:i,arcana:"major",num:i,zh:m[0],en:m[1],kw:m[2].split("、"),text:m[3],sub:"大阿爾克那 "+ROMAN[i]}));
Object.entries(SUITS).forEach(([key,s])=>s.cards.forEach((c,r)=>DECK.push({
  id:DECK.length,arcana:key,rank:r,zh:s.zh+RANK_ZH[r],en:RANK_EN[r]+" of "+s.en,kw:c[0].split("、"),text:c[1],sub:s.zh+"・"+s.el})));

/* ---------- 牌面圖片 ---------- */
const pad2=n=>String(n).padStart(2,"0");
function cardSrc(c){
  return c.arcana==="major"
    ?`cards/major-${pad2(c.num)}-${MAJOR_SLUG[c.num]}.png`
    :`cards/${c.arcana}-${pad2(c.rank+1)}-${RANK_EN[c.rank].toLowerCase()}.png`;
}
function cardImg(c){return `<img src="${cardSrc(c)}" alt="${esc(c.zh)}" loading="lazy">`;}
const BACK=`<svg viewBox="0 0 140 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="1" y="1" width="138" height="238" rx="10" fill="var(--back)"/>
<rect x="8" y="8" width="124" height="224" rx="6" fill="none" stroke="currentColor" stroke-width=".8"/>
<g fill="none" stroke="currentColor" stroke-width=".8" opacity=".9">
<circle cx="70" cy="120" r="40"/><circle cx="70" cy="120" r="28"/>
<path d="M70 60 L70 180 M10 120 L130 120 M28 78 L112 162 M112 78 L28 162"/>
<polygon points="70,92 94,134 46,134"/><polygon points="70,148 94,106 46,106"/></g>
<circle cx="70" cy="120" r="5" fill="currentColor"/></svg>`;

/* ---------- 隨機 ---------- */
function rand(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function pick(k){const ids=DECK.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return ids.slice(0,k).map(i=>DECK[i]);}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dailyCard(key){let h=2166136261;for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return DECK[(h>>>0)%DECK.length];}

/* ---------- 呈現 ---------- */
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function flipHTML(c){return `<div class="flip-inner"><div class="face back">${BACK}</div><div class="face front">${cardImg(c)}</div></div>`;}
function readingHTML(c,pos){
  return `<div class="reading">${pos?`<div class="pos">${pos}</div>`:""}
  <div class="nm">${c.zh}</div><div class="en">${c.en}</div>
  <div class="note">${c.sub}</div>
  <div class="kw">${c.kw.map(k=>`<span>${k}</span>`).join("")}</div>
  <p>${c.text}</p></div>`;
}
function openLater(els){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  els.forEach((el,i)=>setTimeout(()=>el.classList.add("open"),reduce?0:150+i*350));
}

/* ---------- 給 AI 解讀：只顯示與複製文字，不送出任何資料 ---------- */
function showAi(id,text){
  document.getElementById(id+"-p").textContent=text;   // 問題原樣放入，一律走 textContent
  document.querySelector("#"+id+" .ai-box").scrollTop=0;
  document.getElementById(id+"-s").textContent="";
  document.getElementById(id).hidden=false;
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  const a=document.createElement("textarea");a.value=text;a.setAttribute("readonly","");
  a.style.cssText="position:fixed;left:-9999px;top:0";document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand("copy");}catch(e){}
  a.remove();return ok;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-copy]");if(!b)return;
  const id=b.dataset.copy,code=document.getElementById(id+"-p"),s=document.getElementById(id+"-s");
  const ok=await copyText(code.textContent);
  s.textContent=ok?"已複製。":"無法自動複製，請在下方框內全選後手動複製。";
  if(!ok){const r=document.createRange();r.selectNodeContents(code);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}
});
const NO_Q_STEP=["整體局勢","由於沒有具體問題，請以整體局勢與目前最值得注意的主題為主，不要自行假設使用者是在問感情、工作或財務。"];
const Q_STEP=["直接回答問題","針對【占問問題】給出明確、具體的解讀，不要只講抽象象徵。"];
const REMIND_STEP=["實際提醒","列出：\n- 現在較有利的做法\n- 現在需要避免的做法\n- 最值得觀察的訊號"];
function assemble({intro,rules,question,spread,body,steps}){
  const q=(question||"").trim(),O=["一","二","三","四","五"];
  const all=steps.concat([q?Q_STEP:NO_Q_STEP,REMIND_STEP]);
  return [intro,"","重要：",...rules.map((r,i)=>(i+1)+". "+r),"","【占問問題】",q||"未填寫具體問題。","","【牌陣】",spread,"",...body,"",
    "請依以下順序解讀：","",...all.flatMap(([t,b],i)=>[O[i]+"、"+t,b,""]),
    "請不要把象徵性解讀描述成已確定會發生的客觀事件。"].join("\n");
}
function tarotPrompt({question,cards,labels,spread}){
  const multi=cards.length>1;
  const rules=["不要重新抽牌。","不要另外產生隨機牌。","以下牌面就是本次實際結果，只使用正位，請直接依資料解讀。","請區分「傳統塔羅象徵性詮釋」與客觀事實。","塔羅屬象徵性解讀，目前無法以科學方法驗證其預測能力。","【關鍵字】與【本頁牌義】是本網站自撰的簡短說明，不是特定塔羅書的原文，請勿當成經典引用。"];
  const steps=[["每張牌的核心意象",multi?"逐張說明每張牌在它所在位置的主要意思。":"說明這張牌的主要意思。"]];
  if(multi)steps.push(["牌與牌的串連","把牌依「"+labels.join(" → ")+"」的順序串成一條脈絡，不要當成互不相關的牌。"]);
  return assemble({
    intro:"請依照塔羅牌的傳統象徵，解讀以下這次已經完成的抽牌結果。",
    rules,question,spread,steps,
    body:["【牌面】",...cards.map((c,i)=>[(i+1)+". "+labels[i]+"："+c.zh+" "+c.en+"（"+c.sub+"）","   關鍵字："+c.kw.join("、"),"   本頁牌義："+c.text].join("\n"))]
  });
}

// 今日一牌
(function(){
  const key=todayKey(),c=dailyCard(key),f=document.getElementById("dailyFlip");
  f.innerHTML=flipHTML(c);f.setAttribute("aria-label",c.zh);
  document.getElementById("dailyReading").innerHTML=`<p class="note">${key}</p>`+readingHTML(c,"今日");
  showAi("aiDaily",tarotPrompt({question:"",cards:[c],labels:["今日一牌"],spread:"今日一牌（日期 "+key+"，同一天固定同一張）"}));
  openLater([f]);
})();

// 抽牌
const area=document.getElementById("drawArea");
function draw(n){
  const q=document.getElementById("q").value.trim();
  const cards=pick(n),labels=n===3?["過去","現在","未來"]:["抽到的牌"];
  area.innerHTML=(q?`<p class="question">${esc(q)}</p>`:"")+
    `<div class="${n===3?"spread":"single"}">${cards.map((c,i)=>`<div class="slot"><div class="slot-label">${labels[i]}</div><div class="flip" aria-label="${c.zh}">${flipHTML(c)}</div></div>`).join("")}</div>`+
    cards.map((c,i)=>readingHTML(c,labels[i])).join("");
  showAi("aiDraw",tarotPrompt({question:q,cards,labels,spread:n===3?"三張牌：過去・現在・未來":"單張牌"}));
  openLater([...area.querySelectorAll(".flip")]);
}
document.getElementById("drawThree").onclick=()=>draw(3);
document.getElementById("drawOne").onclick=()=>draw(1);
/* 還沒抽牌時只顯示牌背（蓋著），按下按鈕才抽牌並翻開 */
function showBacks(){
  area.innerHTML=`<div class="spread">${["過去","現在","未來"].map(l=>`<div class="slot"><div class="slot-label">${l}</div><div class="flip" role="img" aria-label="牌背，尚未抽牌"><div class="flip-inner"><div class="face back">${BACK}</div></div></div></div>`).join("")}</div><p class="note">牌都蓋著。想好問題後，按上方「抽三張」或「抽一張」。</p>`;
  document.getElementById("aiDraw").hidden=true;
}
showBacks();

// 牌庫
const FILTERS=[["all","全部 78"],["major","大阿爾克那 22"],["wands","權杖 14"],["cups","聖杯 14"],["swords","寶劍 14"],["pentacles","錢幣 14"]];
const fEl=document.getElementById("filters"),lib=document.getElementById("lib");
let cur="all";
function renderLib(){
  fEl.innerHTML=FILTERS.map(([k,l])=>`<button class="chip" id="f-${k}" data-f="${k}" aria-pressed="${k===cur}">${l}</button>`).join("");
  lib.innerHTML=DECK.filter(c=>cur==="all"||c.arcana===cur).map(c=>`<button class="lib-card" data-id="${c.id}">${cardImg(c)}<span>${c.zh}</span></button>`).join("");
}
fEl.onclick=e=>{const b=e.target.closest("[data-f]");if(b){cur=b.dataset.f;renderLib();}};
const dlg=document.getElementById("dlg");
lib.onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const c=DECK[+b.dataset.id];
  document.getElementById("dlgArt").innerHTML=cardImg(c);document.getElementById("dlgText").innerHTML=readingHTML(c,"");dlg.showModal();};
document.getElementById("dlgClose").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});
renderLib();

// 分頁
const tabs=document.querySelectorAll("nav button");
tabs.forEach(t=>t.onclick=()=>{
  tabs.forEach(x=>x.setAttribute("aria-selected",x===t));
  ["daily","draw","lib"].forEach(v=>document.getElementById("view-"+v).hidden=v!==t.dataset.view);
});
</script>
