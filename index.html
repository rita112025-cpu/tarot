<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>塔羅與雷諾曼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: 入口頁，兩張大卡片並排（手機改單欄），下方連到易經 */
:root{
  --bg:#E6EAE4; --surface:#F4F6F2; --ink:#1E3638; --muted:#556866; --line:#C3CCC4; --gold:#9A6F1E; --card:#FBFAF5;
  --f-display:"Marcellus SC","Noto Serif TC",Georgia,serif;
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111C1C; --surface:#182626; --ink:#DCE4DD; --muted:#93A6A2; --line:#2C3E3D; --gold:#D4A64E; --card:#1D2B2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111C1C; --surface:#182626; --ink:#DCE4DD; --muted:#93A6A2; --line:#2C3E3D; --gold:#D4A64E; --card:#1D2B2A; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 48px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-display);letter-spacing:.18em;font-size:12px;color:var(--gold)}
h1{font-family:var(--f-head);font-weight:700;font-size:32px;line-height:1.25;margin:4px 0 0;text-wrap:balance}
p{margin:0}
.note{font-size:13px;color:var(--muted)}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.decks{grid-template-columns:1fr}}
.deck{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;transition:border-color .15s}
.deck:hover{border-color:var(--gold)}
.deck:focus-visible,.other a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.deck svg{width:100%;display:block}
.deck h2{font-family:var(--f-head);font-size:20px;margin:0}
.deck .en{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--gold)}
.deck ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.other a{color:var(--gold);text-decoration:none;border-bottom:1px solid currentColor}
footer{border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">TAROT · LENORMAND</div>
    <h1>塔羅與雷諾曼</h1>
  </header>

  <div class="decks">
    <a class="deck" href="tarot.html" id="go-tarot">
      <svg viewBox="0 0 70 120" aria-hidden="true"><rect x="1" y="1" width="68" height="118" rx="6" fill="var(--card)" stroke="var(--line)"/><rect x="5" y="5" width="60" height="110" rx="4" fill="none" stroke="var(--gold)" stroke-width=".6"/><circle cx="35" cy="60" r="20" fill="none" stroke="currentColor" stroke-width=".8"/><polygon points="35,44 49,68 21,68" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="35" cy="60" r="6" fill="var(--gold)"/></svg>
      <div>
        <div class="en">TAROT · 78</div>
        <h2>塔羅</h2>
        <ul><li>今日一牌</li><li>過去・現在・未來三張</li><li>78 張牌庫（正位）</li></ul>
      </div>
    </a>
    <a class="deck" href="lenormand.html" id="go-lenormand">
      <svg viewBox="0 0 70 120" aria-hidden="true"><rect x="1" y="1" width="68" height="118" rx="6" fill="var(--card)" stroke="var(--line)"/><rect x="5" y="5" width="60" height="110" rx="4" fill="none" stroke="var(--gold)" stroke-width=".6"/><rect x="9" y="9" width="16" height="12" rx="2" fill="var(--surface)" stroke="var(--line)" stroke-width=".6"/><text x="17" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="700" fill="currentColor">9♥</text><text x="35" y="70" text-anchor="middle" font-family="Marcellus SC,Georgia,serif" font-size="34" fill="var(--gold)">1</text><text x="35" y="94" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="700" font-size="11" fill="currentColor">騎士</text></svg>
      <div>
        <div class="en">PETIT LENORMAND · 36</div>
        <h2>古典雷諾曼</h2>
        <ul><li>今日一牌、三張牌</li><li>大牌陣 9×4</li><li>36 張牌庫</li></ul>
      </div>
    </a>
  </div>

  <p class="other">也可以試試 <a href="https://rita112025-cpu.github.io/yijing/">易經起卦 →</a></p>

  <footer>
    <p class="note">牌義為依傳統整理的象徵性解讀，僅供自我反思參考，無法以科學方法驗證。所有抽牌都在瀏覽器內完成，不會送出資料。</p>
  </footer>
</div>
</body>
</html>
