<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>雷諾曼小劇場</title>
<link rel="stylesheet" href="style.css">
<style>
/* 雷諾曼小劇場專屬：選牌區、舞台與選項；共用樣式在 style.css */
:root{--wrap-w:820px}
.lc{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px}
.picked{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pslot{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;text-align:center}
.pslot .role{font-size:12px;color:var(--gold);letter-spacing:.08em}
.pslot .art{width:100%;max-width:130px}
.empty{width:100%;aspect-ratio:2/3;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--surface)}
.pslot .nm{font-family:var(--f-head);font-weight:700;font-size:15px;min-height:1.7em}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:130px}
.tool[data-act="del"]{grid-column:1/-1}
.tool{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;min-width:34px}
.tool:hover:not(:disabled){border-color:var(--gold)}
.tool:disabled{opacity:.35;cursor:default}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.pick{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:3px;text-align:center;border-radius:8px;position:relative}
.pick span{font-size:12px}
.pick[aria-pressed="true"] .lc{outline:3px solid var(--gold);outline-offset:1px}
.pick .ord{position:absolute;top:4px;left:4px;background:var(--gold);color:var(--bg);font-size:12px;font-weight:700;border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.pick:disabled{opacity:.4;cursor:default}
.tag{font-size:13px;color:var(--gold);letter-spacing:.06em}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,96px));gap:10px;justify-content:center}
.strip figure{margin:0;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:12px;color:var(--muted);transition:opacity .2s}
.strip figure.dim{opacity:.45}
.strip figure.now .lc{outline:2px solid var(--gold);outline-offset:1px}
.act{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:var(--surface);border-radius:10px;min-width:0}
.act h2{font-size:18px}
.act h2:focus{outline:none}
.act .lead{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.act .lead p{margin:0}
.done{font-size:14px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--gold)}
.choice small{font-size:12px;color:var(--muted)}
.ending h2{font-size:22px}
.ending .etag{font-size:12px;color:var(--gold);letter-spacing:.12em}
.recap{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
@media (max-width:480px){.act .lead{grid-template-columns:52px 1fr}.act{padding:14px}.pslot .role{min-height:3.4em;font-size:11px}.picked{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="lenormand.html">← 古典雷諾曼</a>
    <div class="eyebrow">LENORMAND THEATER</div>
    <h1>雷諾曼小劇場</h1>
    <p class="note">從 36 張雷諾曼牌中親手選三張，牌就是這齣戲的劇本。全程不抽牌、不洗牌。</p>
  </header>

  <section id="pickView" aria-labelledby="pickTitle">
    <h2 id="pickTitle" tabindex="-1" style="outline:none">選三張牌</h2>
    <p class="note">依序點選三張不同的牌：第一張帶出事件，第二張改變局勢，第三張成為解決事件的線索或代價。再點一次可以撤回，也可以用箭頭調整順序。</p>
    <div class="picked" id="picked"></div>
    <div class="row">
      <button class="btn" id="startBtn" disabled>開演</button>
      <button class="btn ghost" id="clearBtn" disabled>全部撤回</button>
      <span class="note" id="pickStatus" aria-live="polite"></span>
    </div>
    <div class="lib" id="lib"></div>
  </section>

  <section id="stageView" hidden aria-label="劇場">
    <p class="tag">依牌面象徵創作的互動故事</p>
    <div class="strip" id="strip"></div>
    <div id="story" class="readings"></div>
  </section>

  <footer>
    <p class="note">故事是依雷諾曼牌面的象徵自行創作的虛構情節，不是占卜結果，也不是傳統牌義原文。所有內容都在瀏覽器內產生，不需要登入，也不會送出資料。</p>
  </footer>
</div>

<script src="theater-data.js"></script>
<script>
const CARDS=THEATER_CARDS,byNo=n=>CARDS[n-1];
const ROLES=["第一張・事件","第二張・轉折","第三張・線索或代價"];
const ACTS=["第一幕・事件","第二幕・轉折","第三幕・結局"];
const imgOf=(c,eager)=>`<img class="lc" src="cards/thumb/lenormand-${String(c.n).padStart(2,"0")}-${c.slug}.webp" alt="${c.n} ${c.zh}" width="400" height="600"${eager?"":' loading="lazy"'}>`;
const fill=(s,a)=>s.replaceAll("{A}",a.t);

/* 狀態：picks 為選牌順序（牌號）；c1、c2 為兩幕的選擇（0 或 1，未選為 null） */
const st={picks:[],c1:null,c2:null};

/* ---------- 選牌 ---------- */
const pickedEl=document.getElementById("picked"),libEl=document.getElementById("lib");
const startBtn=document.getElementById("startBtn"),clearBtn=document.getElementById("clearBtn"),statusEl=document.getElementById("pickStatus");
libEl.innerHTML=CARDS.map(c=>`<button class="pick" data-n="${c.n}" aria-pressed="false">${imgOf(c)}<span>${c.n} ${c.zh}</span></button>`).join("");
function renderPick(){
  const p=st.picks;
  pickedEl.innerHTML=ROLES.map((r,i)=>{
    const c=p[i]?byNo(p[i]):null;
    return `<div class="pslot"><div class="role">${r}</div><div class="art">${c?imgOf(c,true):`<div class="empty">尚未選</div>`}</div>
      <div class="nm">${c?c.n+" "+c.zh:""}</div>
      ${c?`<div class="tools">
        <button class="tool" data-act="up" data-i="${i}" ${i===0?"disabled":""} aria-label="把${c.zh}往前移">◀</button>
        <button class="tool" data-act="down" data-i="${i}" ${i===p.length-1?"disabled":""} aria-label="把${c.zh}往後移">▶</button>
        <button class="tool" data-act="del" data-i="${i}" aria-label="撤回${c.zh}">撤回</button></div>`:""}
    </div>`;}).join("");
  libEl.querySelectorAll(".pick").forEach(b=>{
    const n=+b.dataset.n,k=p.indexOf(n),on=k>=0;
    b.setAttribute("aria-pressed",on);
    b.disabled=!on&&p.length>=3;
    const old=b.querySelector(".ord");if(old)old.remove();
    if(on)b.insertAdjacentHTML("afterbegin",`<span class="ord" aria-hidden="true">${k+1}</span>`);
  });
  startBtn.disabled=p.length!==3;clearBtn.disabled=!p.length;
  statusEl.textContent=p.length===3?"三張都選好了，可以開演。":`已選 ${p.length} 張，還差 ${3-p.length} 張。`;
}
libEl.onclick=e=>{
  const b=e.target.closest(".pick");if(!b||b.disabled)return;
  const n=+b.dataset.n,k=st.picks.indexOf(n);
  if(k>=0)st.picks.splice(k,1);else if(st.picks.length<3)st.picks.push(n);
  renderPick();
};
pickedEl.onclick=e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const i=+b.dataset.i,p=st.picks,a=b.dataset.act;
  if(a==="del")p.splice(i,1);
  else{const j=a==="up"?i-1:i+1;[p[i],p[j]]=[p[j],p[i]];}
  renderPick();
  const again=pickedEl.querySelector(`[data-act="${a}"][data-i="${a==="up"?i-1:a==="down"?i+1:i}"]:not(:disabled)`);
  if(again)again.focus();
};
clearBtn.onclick=()=>{st.picks=[];renderPick();};

/* ---------- 舞台 ---------- */
const pickView=document.getElementById("pickView"),stageView=document.getElementById("stageView");
const storyEl=document.getElementById("story"),stripEl=document.getElementById("strip");
function startShow(){
  if(st.picks.length!==3||new Set(st.picks).size!==3)return;
  st.c1=null;st.c2=null;
  pickView.hidden=true;stageView.hidden=false;
  scrollTo({top:0});
  renderStage();
}
startBtn.onclick=startShow;

function choiceHTML(step,labels,hints){
  return `<div class="choices">${labels.map((l,i)=>`<button class="choice" data-step="${step}" data-c="${i}"><span>${l}</span>${hints?`<small>${hints[i]}</small>`:""}</button>`).join("")}</div>`;
}
function actHTML(k,c,body,id){
  return `<div class="act" id="${id}"><h2 tabindex="-1">${ACTS[k]}</h2><div class="lead">${imgOf(c,true)}<div class="readings">${body}</div></div></div>`;
}
function renderStage(){
  const [A,B,C]=st.picks.map(byNo),cur=st.c1===null?0:st.c2===null?1:2;
  stripEl.innerHTML=[A,B,C].map((c,i)=>`<figure class="${i===cur?"now":i>cur?"dim":""}">${imgOf(c,true)}<figcaption>${ROLES[i].split("・")[0]}・${c.zh}</figcaption></figure>`).join("");
  let h="";
  // 第一幕
  h+=actHTML(0,A,`<p>${A.e}</p>`+(st.c1===null?choiceHTML(1,A.c1):`<p class="done">你選擇：${A.c1[st.c1]}</p>`),"act1");
  // 第二幕：先接第一幕的結果，再由第二張牌改變局勢
  if(st.c1!==null){
    const lead=st.c1===0?"你已經露過面了，接下來要——":"到目前為止，還沒有人知道你在查。接下來要——";
    h+=actHTML(1,B,`<p>${A.a1[st.c1]}</p><p>${fill(B.turn,A)}</p>`+
      (st.c2===null?`<p class="note">${lead}</p>`+choiceHTML(2,B.c2,THEATER_HINT[st.c1]):`<p class="done">你選擇：${B.c2[st.c2]}</p>`),"act2");
  }
  // 第三幕與結局
  if(st.c2!==null){
    const end=THEATER_ENDINGS[st.c1][st.c2];
    const third=end.role==="clue"?fill(C.clue,A):`關於${A.t}，事情最後還是解決了。${fill(C.cost,A)}`;
    h+=actHTML(2,C,`<p>${B.a2[st.c2]}</p><p>${third}</p>`,"act3");
    h+=`<div class="act ending" id="ending"><div class="etag">結局・第三張牌成為${end.role==="clue"?"線索":"代價"}</div>
      <h2 tabindex="-1">${end.title}</h2><p>${end.text}</p>
      <ul class="recap"><li>牌序：${A.zh} → ${B.zh} → ${C.zh}</li><li>第一幕：${A.c1[st.c1]}</li><li>第二幕：${B.c2[st.c2]}</li></ul>
      <div class="row"><button class="btn" id="replayBtn">用同一組牌重演</button><button class="btn ghost" id="repickBtn">重新選牌</button></div></div>`;
  }
  storyEl.innerHTML=h;
  const target=document.getElementById(cur===2?"ending":"act"+(cur+1));
  const head=target.querySelector("h2");
  if(cur>0){target.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});}
  head.focus({preventScroll:true});
}
storyEl.onclick=e=>{
  const ch=e.target.closest(".choice");
  if(ch){const v=+ch.dataset.c;if(ch.dataset.step==="1"&&st.c1===null)st.c1=v;else if(ch.dataset.step==="2"&&st.c2===null)st.c2=v;renderStage();return;}
  if(e.target.id==="replayBtn"){st.c1=null;st.c2=null;renderStage();scrollTo({top:0});return;}
  if(e.target.id==="repickBtn"){st.c1=null;st.c2=null;st.picks=[];stageView.hidden=true;pickView.hidden=false;renderPick();scrollTo({top:0});document.getElementById("pickTitle").focus({preventScroll:true});}
};

renderPick();
</script>
</body>
</html>
